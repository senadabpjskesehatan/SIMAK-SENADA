    <script>
      // Suppress dev server iframe WebSocket reconnection noise
      (function() {
        function shouldSuppress(msg, stack, file) {
          var s = ((msg || '') + ' ' + (stack || '') + ' ' + (file || '')).toLowerCase();
          return (
            s.indexOf('websocket') !== -1 ||
            s.indexOf('@vite/client') !== -1 ||
            s.indexOf('createwebsocketmodulerunnertransport') !== -1 ||
            s.indexOf('ws://') !== -1 ||
            s.indexOf('wss://') !== -1
          );
        }
        window.addEventListener('error', function(e) {
          var msg = e && e.message ? String(e.message) : '';
          var file = e && e.filename ? String(e.filename) : '';
          var stack = e && e.error && e.error.stack ? String(e.error.stack) : '';
          if (shouldSuppress(msg, stack, file)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e ? e.reason : null;
          var msg = reason && reason.message ? String(reason.message) : String(reason || '');
          var stack = reason && reason.stack ? String(reason.stack) : '';
          if (shouldSuppress(msg, stack, '')) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
