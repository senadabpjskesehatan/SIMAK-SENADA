    <script>
      // Suppress dev server iframe WebSocket reconnection noise
      window.addEventListener('error', function(e) {
        if (
          e?.message?.includes('WebSocket') ||
          e?.filename?.includes('@vite/client') ||
          (typeof e?.error?.stack === 'string' && e.error.stack.includes('@vite/client'))
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (
          e?.reason?.message?.includes('WebSocket') ||
          (typeof e?.reason?.stack === 'string' && e.reason.stack.includes('@vite/client'))
        ) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
    </script>
